<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">egodup detection architecture</title><desc id="desc">Video files flow through exact hashing, SSCD features, raw FAISS retrieval, cosine TN localization, and review evidence.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091326"/><stop offset="1" stop-color="#15142f"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".35"/></filter></defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <text x="54" y="64" fill="#eff6ff" font-family="system-ui" font-size="32" font-weight="700">egodup</text><text x="54" y="94" fill="#93a4c7" font-family="system-ui" font-size="15">LOCAL-FIRST • INSPECTABLE • REVIEW-ONLY</text>
  <g font-family="system-ui" filter="url(#shadow)">
    <g transform="translate(55 145)"><rect width="180" height="112" rx="16" fill="#14213d" stroke="#31466f"/><text x="24" y="43" fill="#dbeafe" font-size="18" font-weight="650">Video files</text><text x="24" y="74" fill="#93a4c7" font-size="14">PTS sampling</text></g>
    <g transform="translate(280 145)"><rect width="180" height="112" rx="16" fill="#14213d" stroke="#22d3ee"/><text x="24" y="43" fill="#dbeafe" font-size="18" font-weight="650">SHA-256</text><text x="24" y="74" fill="#67e8f9" font-size="14">exact equality</text></g>
    <g transform="translate(505 145)"><rect width="180" height="112" rx="16" fill="#14213d" stroke="#8b5cf6"/><text x="24" y="43" fill="#dbeafe" font-size="18" font-weight="650">SSCD · 512d</text><text x="24" y="74" fill="#c4b5fd" font-size="14">raw float32</text></g>
    <g transform="translate(730 145)"><rect width="180" height="112" rx="16" fill="#14213d" stroke="#f59e0b"/><text x="24" y="43" fill="#dbeafe" font-size="18" font-weight="650">FAISS · IP</text><text x="24" y="74" fill="#fcd34d" font-size="14">candidate retrieval</text></g>
    <g transform="translate(955 145)"><rect width="190" height="112" rx="16" fill="#14213d" stroke="#34d399"/><text x="24" y="43" fill="#dbeafe" font-size="18" font-weight="650">TN alignment</text><text x="24" y="74" fill="#6ee7b7" font-size="14">interval evidence</text></g>
  </g>
  <g stroke="#52698f" stroke-width="3" fill="none"><path d="M235 201h45"/><path d="M460 201h45"/><path d="M685 201h45"/><path d="M910 201h45"/></g>
  <text x="55" y="320" fill="#8394b8" font-family="system-ui" font-size="15">Exact hashes and perceptual evidence stay distinct. A finding always requires human review.</text>
</svg>

