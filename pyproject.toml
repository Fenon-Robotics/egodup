[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "egodup"
version = "0.1.0"
description = "Local-first detection of reused source footage in egocentric video"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Fenon Robotics"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "av==16.0.1",
  "faiss-cpu==1.11.0.post1",
  "filelock==3.19.1",
  "networkx==3.5",
  "numpy==2.2.6",
  "pillow==11.3.0",
  "pydantic==2.11.7",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "typer==0.16.1",
]

[project.optional-dependencies]
dev = ["build==1.3.0", "pytest==8.4.1", "pytest-cov==6.2.1", "ruff==0.12.9"]

[project.scripts]
egodup = "egodup.cli:app"

[project.urls]
Homepage = "https://github.com/Fenon-Robotics/egodup"
Documentation = "https://github.com/Fenon-Robotics/egodup#readme"
Issues = "https://github.com/Fenon-Robotics/egodup/issues"
Source = "https://github.com/Fenon-Robotics/egodup"

[tool.hatch.build.targets.wheel]
packages = ["src/egodup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
